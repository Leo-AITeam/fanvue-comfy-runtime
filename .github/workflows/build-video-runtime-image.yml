name: Build Fanvue Video Runtime Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push video runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.video
          push: true
          tags: |
            ghcr.io/leo-aiteam/fanvue-comfy-runtime:video-latest
            ghcr.io/leo-aiteam/fanvue-comfy-runtime:video-${{ github.sha }}
