name: Build Fanvue Comfy Runtime Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Dockerfile.photo
      - bootstrap_fanvue_comfyui.sh
      - runpod/**
      - scripts/**
      - models_manifest.json
      - custom_nodes_manifest.json
      - schemas/**
      - job_templates/**
      - workflows/**
      - api_prompts/**
      - .github/workflows/build-runtime-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/leo-aiteam/fanvue-comfy-runtime:latest
            ghcr.io/leo-aiteam/fanvue-comfy-runtime:${{ github.sha }}

      - name: Build and push photo runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.photo
          push: true
          tags: |
            ghcr.io/leo-aiteam/fanvue-comfy-runtime:photo-latest
            ghcr.io/leo-aiteam/fanvue-comfy-runtime:photo-${{ github.sha }}
