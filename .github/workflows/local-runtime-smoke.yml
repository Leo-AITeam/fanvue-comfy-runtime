name: Local runtime smoke

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  local-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run local runtime smoke suite
        run: node scripts/local_runtime_smoke.mjs
